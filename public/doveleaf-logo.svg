  <line x1="60" y1="40" x2="74" y2="34" stroke="#27ae60" stroke-width="0.7"/>

  <!-- Brand name -->
  <text x="115" y="50" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#ffffff" letter-spacing="3">DOVELEAF</text>
  <text x="115" y="72" font-family="Georgia, serif" font-size="18" fill="#FFD700" letter-spacing="6">DRYCLEANERS</text>

