<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120">
  <!-- Dove body -->
  <ellipse cx="55" cy="48" rx="22" ry="17" fill="#ffffff"/>
  <!-- Dove head -->
  <circle cx="77" cy="38" r="11" fill="#ffffff"/>
  <!-- Dove beak -->
  <polygon points="88,38 97,36 88,33" fill="#FFD700"/>
  <!-- Dove eye -->
  <circle cx="80" cy="36" r="2" fill="#000080"/>
  <!-- Dove wing -->
  <path d="M40,48 Q24,24 48,18 Q42,34 40,48Z" fill="#e0e8f5"/>
  <path d="M45,46 Q32,28 52,24 Q47,36 45,46Z" fill="#c8d6ea"/>
  <!-- Dove tail -->
