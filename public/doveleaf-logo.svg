  <line x1="115" y1="82" x2="410" y2="82" stroke="#FFD700" stroke-width="0.6" opacity="0.5"/>
  <text x="115" y="102" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" opacity="0.85" letter-spacing="1">Outstanding Quality &amp; Timely Services</text>
